[build-system]
requires = [
  "hatchling >= 1.26",
  "hatch-requirements-txt >= 0.4.1"
]
build-backend = "hatchling.build"

[project]
name = "textual-dag"
description = "Directed acyclic graph (DAG) widget for Textual"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"] # spellchecker: ignore LICEN
authors = [
  {name = "Jeremy Watkins", email = "DevOpsJeremy@gmail.com"}
]
maintainers = [
  {name = "Jeremy Watkins", email = "DevOpsJeremy@gmail.com"}
]

dynamic = [
  "dependencies",
  "version"
]

[project.urls]
Repository = "https://github.com/DevOpsJeremy/textual-dag"
Issues = "https://github.com/DevOpsJeremy/textual-dag/issues"
Changelog = "https://github.com/DevOpsJeremy/textual-dag/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/textual_dag/__init__.py"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
include = ["textual_dag"]

[tool.hatch.build.targets.sdist]
include = ["textual_dag", "/requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt]
filename = "requirements.txt"

[tool.pytest]
strict = true
addopts = ["--junit-xml", "pytest.junit.xml"]
junit_suite_name = "textual_dag"
